webhooks:
  workspacePaymentFinalized:
    post:
      tags:
        - Workspace Webhook
      summary: Workspace final payment webhook
      description: |
        BSTN sends this sanitized payload once to the configured workspace webhook target when a payment reaches a terminal status. The target is the project's current default_webhook_url, falling back to the payment webhook_url for legacy records.
        The request includes X-BSTN-Signature, an HMAC-SHA256 of the raw JSON body using RETURN_SIGNATURE_SECRET.
        To mark delivery as successful, the workspace must return HTTP 2xx with JSON body `{ "success": true }`.
